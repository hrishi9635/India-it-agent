# The schedule that runs the agent for free on GitHub's computers.
# Four times a day it updates prices, news and stock-exchange filings. When a company's
# results are filed, it runs the AI analysis. It then saves the data back to this
# project, and the online dashboard updates by itself.
name: Run the agent

on:
  schedule:                 # 4 times a day, so results are picked up within hours of being filed
    - cron: "15 8 * * *"      # 1:45 PM IST  (some companies announce during market hours)
    - cron: "0 12 * * *"      # 5:30 PM IST  (most announce after the market closes at 3:30 PM)
    - cron: "30 14 * * *"     # 8:00 PM IST
    - cron: "30 17 * * *"     # 11:00 PM IST (late announcements)
  workflow_dispatch:          # adds a "Run workflow" button for running it any time
    inputs:
      force:
        description: "Re-analyse every company with AI (yes/no)"
        default: "no"

permissions:
  contents: write

concurrency:
  group: agent
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install add-ons
        run: pip install -r requirements.txt
      - name: Run the agent
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.force }}" = "yes" ]; then
            python run_agent.py --force
          else
            python run_agent.py
          fi
      - name: Save the new data
        run: |
          git config user.name "results-agent"
          git config user.email "results-agent@users.noreply.github.com"
          git add data
          git diff --cached --quiet && echo "Nothing changed" && exit 0
          git commit -m "Agent update $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
